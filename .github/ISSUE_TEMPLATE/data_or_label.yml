name: Data or label proposal
description: Propose a new source-bound unit, validation evidence, or a correction
title: "[Data] "
labels: ["data-proposal"]
body:
  - type: dropdown
    id: proposal_type
    attributes:
      label: Proposal type
      options:
        - New benchmark unit
        - Additional validation evidence
        - Label or source correction
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Immutable source and revision
    validations:
      required: true
  - type: textarea
    id: contract
    attributes:
      label: Query requirement and sibling conflict
      description: Give exact spans or hashes; do not post restricted full text.
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence and proposed taxonomy assignment
    validations:
      required: true
  - type: textarea
    id: terms
    attributes:
      label: Redistribution status
    validations:
      required: true
  - type: checkboxes
    id: safety
    attributes:
      label: Safety
      options:
        - label: This issue contains no credentials, private data, or prohibited source text.
          required: true
